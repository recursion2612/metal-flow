[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdac-quantum-optimizer"
version = "0.1.0"
description = "PhysicsNeMo surrogate-assisted Qiskit Metal and AWS Palace optimizer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "nvidia-physicsnemo>=2.2,<3",
]

[project.optional-dependencies]
cad = [
    "quantum-metal[mesh]>=0.7.4",
]
test = ["pytest>=8"]

[project.scripts]
cdac-train-surrogate = "train_nemo_surrogate:main"
cdac-run-optimization = "run_optimization:main"

[tool.setuptools]
py-modules = ["main", "run_optimization", "train_nemo_surrogate"]

[tool.setuptools.packages.find]
include = ["src*"]
