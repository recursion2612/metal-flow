[project]
name = "metal-flow"
version = "0.1.0"
description = "A series of workflows for quantum chip design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pandas==2.3",
    "pyepr-quantum==1.0.1",
    "pypalace>=0.1.3",
    "pywin32>=312 ; sys_platform == 'win32'",
    "quantum-metal[full]",
    "quantum-metal[full] ; sys_platform == 'win32'",
    "quantum-metal[mesh] ; sys_platform == 'darwin'",
]

[tool.uv.workspace]
members = [
    "quantum-metal",
    "packages/*"
]

[tool.uv.sources]
quantum-metal = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
