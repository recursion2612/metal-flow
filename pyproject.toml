[project]
name = "metal-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pandas==2.3",
    "pyepr-quantum==1.0.1",
    "pywin32>=312",
    "quantum-metal[full]",
]

[tool.uv.workspace]
members = [
    "quantum-metal",
]

[tool.uv.sources]
quantum-metal = { workspace = true, editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
