[project]
name = "metal-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cdac-quantum-optimizer",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "mph>=1.4.0",
    "numpy>=1.24",
    "nvidia-physicsnemo>=2.2,<3",
    "pandas>=2.0",
    "pyepr-quantum==1.0.1",
    "pypalace>=0.1.3",
    "pyvista>=0.49.0",
    "quantum-metal[mesh]==0.7.4",
    "sqdmetal",
    "torch>=2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "quantum-metal",
    "SQDMetal",
    "Opt/Quantum_Opt_Pipeline",
]

[tool.uv.sources]
quantum-metal = { workspace = true, editable = true }
sqdmetal = { workspace = true, editable = true }
cdac-quantum-optimizer = { workspace = true }
